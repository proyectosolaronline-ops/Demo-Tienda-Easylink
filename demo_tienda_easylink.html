<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f6f7;color:#1a1a2e;font-size:14px}
:root{--primary:#1a73e8;--cta:#ff6900;--success:#00a650;--border:#dde1e7;--surface:#fff;--muted:#717185}
.navbar{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{font-weight:800;font-size:17px;color:var(--primary)}
.cart-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:var(--cta);color:#fff;font-size:12px;font-weight:700;cursor:pointer;border:none}
.cart-pill .n{background:rgba(255,255,255,.25);border-radius:99px;padding:1px 7px;font-size:11px}
.hero{background:var(--primary);color:#fff;padding:20px 16px;min-height:90px;display:flex;align-items:center}
.hero h1{font-size:24px;font-weight:800;margin-bottom:4px}
.hero p{font-size:13px;opacity:.8}
.demo-badge{background:rgba(255,255,0,.25);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:8px;border:1px solid rgba(255,255,0,.4)}
.catalog{padding:14px 12px 80px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);transition:all .15s}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-wrap{margin-bottom:12px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:#1a1a2e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--primary)}
.pcard-img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:36px;background:#f8f9fb;position:relative}
.pcard-body{padding:10px;flex:1;display:flex;flex-direction:column}
.pcard-cat{font-size:9px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pcard-name{font-size:12px;font-weight:700;margin-bottom:8px;line-height:1.3;flex:1}
.pcard-foot{display:flex;align-items:center;justify-content:space-between}
.price{font-size:15px;font-weight:800;color:#1a1a2e}
.add-btn{padding:5px 10px;background:var(--cta);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.add-btn.in{background:#e6f7ee;color:var(--success);border:1px solid #b7eb8f}
.promo-tag{position:absolute;top:6px;left:6px;background:var(--cta);color:#fff;font-size:8px;font-weight:700;padding:2px 7px;border-radius:99px}
.float-cart{position:fixed;bottom:0;left:0;right:0;background:var(--cta);color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;cursor:pointer;z-index:80}
.float-cart.on{display:flex}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;color:#1a1a2e;width:100%;border-radius:20px 20px 0 0;max-height:85vh;overflow-y:auto;padding-bottom:20px}
.modal-drag{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto;display:block}
.modal-header{padding:0 16px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:800}
.xbtn{background:#f1f3f6;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.pm-img{height:180px;display:flex;align-items:center;justify-content:center;font-size:72px;background:#f8f9fb}
.pm-body{padding:16px}
.pm-name{font-size:20px;font-weight:800;margin-bottom:6px}
.pm-cat{font-size:11px;color:var(--primary);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.pm-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.pm-price{font-size:28px;font-weight:800;margin-bottom:16px}
.pm-add{width:100%;padding:12px;background:var(--cta);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.cart-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f0f0;align-items:center}
.ci-img{width:48px;height:48px;border-radius:8px;background:#f8f9fb;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ci-name{font-size:13px;font-weight:700;margin-bottom:2px}
.ci-price{font-size:12px;color:var(--primary);font-weight:700}
.qty{display:flex;align-items:center;gap:6px;margin-top:5px}
.qb{width:22px;height:22px;border-radius:6px;background:#f1f3f6;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qb:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.cart-foot{padding:14px 16px;border-top:1px solid var(--border);background:#f8f9fb}
.total-row{display:flex;justify-content:space-between;margin-bottom:12px}
.total-val{font-size:22px;font-weight:800}
.checkout-btn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.success-msg{text-align:center;padding:32px 20px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:600;display:none;z-index:200;white-space:nowrap}
.co-form{padding:16px}
.co-form label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.co-form input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:10px;outline:none;font-family:inherit}
.co-form input:focus{border-color:var(--primary)}
.step-indicator{display:flex;gap:6px;align-items:center;padding:10px 16px;background:#f8f9fb;font-size:11px;color:var(--muted)}
.step{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;background:var(--border);color:var(--muted)}
.step.done{background:var(--success);color:#fff}
.step.active{background:var(--primary);color:#fff}
.step-line{flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">EasyLink Demo</div>
  <button class="cart-pill" id="cart-btn" onclick="openCart()">
    Solicitudes <span class="n" id="nav-count">0</span>
  </button>
</nav>

<div class="hero">
  <div>
    <div class="demo-badge">DEMO INTERACTIVO</div>
    <h1 id="hero-title">Bazar El Mercado</h1>
    <p>Ropa, electrónica, hogar y más — Queretaro, Qro.</p>
  </div>
</div>

<section class="catalog">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Buscar productos..." oninput="filterSearch(this.value)">
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<div class="float-cart" id="float-cart" onclick="openCart()">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">🛒</span>
    <span id="fc-count" style="background:rgba(255,255,255,.25);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700">0</span>
    <span style="font-size:12px;opacity:.85">en tu solicitud</span>
  </div>
  <div>
    <div style="font-size:16px;font-weight:800" id="fc-total">$0.00</div>
    <div style="font-size:10px;opacity:.7;text-align:right">Ver pedido →</div>
  </div>
</div>

<div class="modal-bg" id="pm-bg" onclick="if(event.target===this)closePM()">
  <div class="modal">
    <span class="modal-drag"></span>
    <div id="pm-content"></div>
  </div>
</div>

<div class="modal-bg" id="cart-bg" onclick="if(event.target===this)closeCart()">
  <div class="modal">
    <span class="modal-drag"></span>
    <div class="modal-header">
      <span class="modal-title" id="cart-title">Tus solicitudes</span>
      <button class="xbtn" onclick="closeCart()">✕</button>
    </div>
    <div id="cart-view-inner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var PRODUCTS = [
  {id:'p1',name:'Playera básica algodón',cat:'Ropa',emoji:'👕',price:180,desc:'100% algodón peinado, corte regular, disponible en 6 colores. Ideal para uso diario.',promo:false},
  {id:'p2',name:'Jeans slim fit',cat:'Ropa',emoji:'👖',price:450,desc:'Mezclilla stretch de alta calidad, corte slim moderno. Tallas 28-38.',promo:true},
  {id:'p3',name:'Vestido casual floral',cat:'Ropa',emoji:'👗',price:390,desc:'Tela ligera con estampado floral, ideal para primavera-verano. Tallas S-XL.',promo:false},
  {id:'p4',name:'Sudadera con capucha',cat:'Ropa',emoji:'🧥',price:520,desc:'Fleece suave interior, bolsa canguro, cordones ajustables. Unisex.',promo:false},
  {id:'p5',name:'Audífonos inalámbricos',cat:'Electrónica',emoji:'🎧',price:890,desc:'Bluetooth 5.0, autonomía 20hrs, cancelación de ruido básica. Incluye estuche.',promo:true},
  {id:'p6',name:'Cargador USB-C 65W',cat:'Electrónica',emoji:'🔌',price:280,desc:'Carga rápida compatible con laptops, tablets y teléfonos. Cable incluido.',promo:false},
  {id:'p7',name:'Lámpara LED escritorio',cat:'Hogar',emoji:'💡',price:340,desc:'3 niveles de brillo, luz cálida/fría/neutra. Base antideslizante, cuello flexible.',promo:false},
  {id:'p8',name:'Set de tazas (4 pzas)',cat:'Hogar',emoji:'☕',price:220,desc:'Cerámica resistente 350ml, apta para microondas y lavavajillas. Colores surtidos.',promo:false},
  {id:'p9',name:'Mochila urbana 20L',cat:'Accesorios',emoji:'🎒',price:650,desc:'Compartimento laptop 15", porta botella lateral, tela impermeable. Varios colores.',promo:true},
  {id:'p10',name:'Cartera slim RFID',cat:'Accesorios',emoji:'👛',price:195,desc:'Bloqueo RFID, 8 tarjetas, compartimento billetes. Cuero sintético premium.',promo:false},
  {id:'p11',name:'Termo acero inox 500ml',cat:'Hogar',emoji:'🫙',price:310,desc:'Doble pared al vacío, mantiene frío 24hrs / caliente 12hrs. Libre de BPA.',promo:false},
  {id:'p12',name:'Mouse inalámbrico',cat:'Electrónica',emoji:'🖱️',price:245,desc:'2.4GHz, 1600 DPI ajustable, batería AA incluida. Compatible Windows/Mac.',promo:false}
];

var cart = [], activeCat = '', searchQ = '';

var cats = ['Todos',...[...new Set(PRODUCTS.map(function(p){return p.cat}))]];
var filtersEl = document.getElementById('filters');
filtersEl.innerHTML = cats.map(function(c,i){
  return '<div class="chip'+(i===0?' on':'')+'" onclick="setCat(\''+c+'\',this)">'+c+'</div>';
}).join('');

function setCat(c,el){
  activeCat = c==='Todos'?'':c;
  document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on');
  renderGrid();
}

function filterSearch(v){
  searchQ = v.toLowerCase().trim();
  renderGrid();
}

function renderGrid(){
  var list = PRODUCTS.filter(function(p){
    if(activeCat && p.cat!==activeCat) return false;
    if(searchQ && (p.name+p.cat+p.desc).toLowerCase().indexOf(searchQ)===-1) return false;
    return true;
  });
  var g = document.getElementById('grid');
  if(!list.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Sin resultados</div>';return;}
  g.innerHTML = list.map(function(p){
    var inCart = cart.find(function(c){return c.id===p.id;});
    return '<div class="pcard" onclick="openPM(\''+p.id+'\')">'
      +'<div class="pcard-img">'+p.emoji
      +(p.promo?'<div class="promo-tag">PROMO</div>':'')
      +'</div>'
      +'<div class="pcard-body">'
      +'<div class="pcard-cat">'+p.cat+'</div>'
      +'<div class="pcard-name">'+p.name+'</div>'
      +'<div class="pcard-foot">'
      +'<span class="price">$'+p.price+'</span>'
      +'<button class="add-btn'+(inCart?' in':'')+'" onclick="event.stopPropagation();addToCart(\''+p.id+'\')">'+(inCart?inCart.qty:'+')+'</button>'
      +'</div></div></div>';
  }).join('');
}

function openPM(id){
  var p = PRODUCTS.find(function(x){return x.id===id;});
  if(!p) return;
  var inCart = cart.find(function(c){return c.id===id;});
  document.getElementById('pm-content').innerHTML =
    '<div class="pm-img">'+p.emoji+(p.promo?'<div style="position:absolute;top:10px;left:10px;background:var(--cta);color:#fff;font-size:9px;font-weight:700;padding:3px 10px;border-radius:99px">PROMO</div>':'')+'</div>'
    +'<div class="pm-body">'
    +'<div class="pm-cat">'+p.cat+'</div>'
    +'<div class="pm-name">'+p.name+'</div>'
    +'<div class="pm-desc">'+p.desc+'</div>'
    +'<div class="pm-price">$'+p.price+' MXN</div>'
    +'<button class="pm-add" onclick="addToCart(\''+p.id+'\');closePM()">'+(inCart?'Agregar uno más':'Agregar a solicitudes')+'</button>'
    +'</div>';
  document.getElementById('pm-bg').classList.add('on');
}
function closePM(){document.getElementById('pm-bg').classList.remove('on');}

function addToCart(id){
  var p = PRODUCTS.find(function(x){return x.id===id;});
  if(!p) return;
  var item = cart.find(function(c){return c.id===id;});
  if(item) item.qty++;
  else cart.push({id:id,name:p.name,emoji:p.emoji,price:p.price,qty:1});
  renderGrid(); updateNav();
  showToast('"'+p.name+'" añadido');
}

function updQty(id,d){
  var item = cart.find(function(c){return c.id===id;});
  if(!item) return;
  item.qty+=d;
  if(item.qty<=0) cart=cart.filter(function(c){return c.id!==id;});
  renderCartView(); renderGrid(); updateNav();
}

function cartTotal(){return cart.reduce(function(s,c){return s+c.price*c.qty;},0);}
function cartCount(){return cart.reduce(function(s,c){return s+c.qty;},0);}

function updateNav(){
  var cnt=cartCount(),tot=cartTotal();
  document.getElementById('nav-count').textContent=cnt;
  var fc=document.getElementById('float-cart');
  fc.className='float-cart'+(cnt>0?' on':'');
  document.getElementById('fc-count').textContent=cnt;
  document.getElementById('fc-total').textContent='$'+tot.toFixed(2);
}

var cartStep=1;
function openCart(){
  cartStep=1;
  renderCartView();
  document.getElementById('cart-bg').classList.add('on');
}
function closeCart(){document.getElementById('cart-bg').classList.remove('on');}

function renderCartView(){
  var el=document.getElementById('cart-view-inner');
  var t=document.getElementById('cart-title');
  if(cartStep===1){
    t.textContent='Tus solicitudes';
    if(!cart.length){
      el.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:10px">🛒</div><p>Sin solicitudes aún</p><p style="font-size:11px;margin-top:6px;color:var(--muted)">Agrega productos desde el catálogo</p></div>';
      return;
    }
    var items=cart.map(function(c){
      return '<div class="cart-item">'
        +'<div class="ci-img">'+c.emoji+'</div>'
        +'<div style="flex:1">'
        +'<div class="ci-name">'+c.name+'</div>'
        +'<div class="ci-price">$'+c.price+' c/u</div>'
        +'<div class="qty">'
        +'<button class="qb" onclick="updQty(\''+c.id+'\',-1)">−</button>'
        +'<span style="font-size:13px;font-weight:700;min-width:18px;text-align:center">'+c.qty+'</span>'
        +'<button class="qb" onclick="updQty(\''+c.id+'\',1)">+</button>'
        +'</div></div>'
        +'<div style="font-weight:800;font-size:13px">$'+(c.price*c.qty).toFixed(0)+'</div>'
        +'</div>';
    }).join('');
    el.innerHTML=items
      +'<div class="cart-foot">'
      +'<div class="total-row"><span style="font-size:13px;color:var(--muted)">Total estimado</span><span class="total-val">$'+cartTotal().toFixed(2)+'</span></div>'
      +'<button class="checkout-btn" onclick="cartStep=2;renderCartView()">Continuar con el pedido →</button>'
      +'</div>';
  } else if(cartStep===2){
    t.textContent='Datos del pedido';
    el.innerHTML='<div class="step-indicator">'
      +'<div class="step done">1</div><div class="step-line"></div>'
      +'<div class="step active">2</div><div class="step-line"></div>'
      +'<div class="step">3</div>'
      +'</div>'
      +'<div class="co-form">'
      +'<button onclick="cartStep=1;renderCartView()" style="background:none;border:none;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;padding:0">← Volver</button>'
      +'<label>Nombre completo *</label><input id="co-name" placeholder="Juan García">'
      +'<label>Teléfono *</label><input id="co-phone" placeholder="+52 442 xxx xxxx" type="tel">'
      +'<label>Email</label><input id="co-email" placeholder="juan@email.com" type="email">'
      +'<label>Dirección de entrega</label><input id="co-addr" placeholder="Calle, número, colonia...">'
      +'<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:14px">'
      +'🔒 Tus datos se usan únicamente para procesar tu solicitud.</div>'
      +'<button class="checkout-btn" onclick="placeOrder()">Confirmar pedido</button>'
      +'</div>';
  } else if(cartStep===3){
    t.textContent='¡Pedido confirmado!';
    var orderId='EL-'+Math.floor(Math.random()*9000+1000);
    el.innerHTML='<div class="success-msg">'
      +'<div style="font-size:52px;margin-bottom:12px">✅</div>'
      +'<div style="font-size:20px;font-weight:800;margin-bottom:8px">¡Solicitud enviada!</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Número de pedido:</div>'
      +'<div style="font-family:monospace;background:#f1f3f6;padding:8px 18px;border-radius:8px;display:inline-block;font-weight:700;color:var(--primary);font-size:13px;margin-bottom:16px">'+orderId+'</div>'
      +'<p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px">Te contactaremos por WhatsApp para confirmar disponibilidad y detalles de entrega.</p>'
      +'<button class="checkout-btn" onclick="cart=[];updateNav();closeCart();renderGrid()" style="max-width:220px;margin:0 auto">Cerrar</button>'
      +'</div>';
  }
}

function placeOrder(){
  var name=(document.getElementById('co-name')||{}).value||'';
  var phone=(document.getElementById('co-phone')||{}).value||'';
  if(!name.trim()||!phone.trim()){showToast('Nombre y teléfono requeridos');return;}
  cartStep=3;
  renderCartView();
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},2500);
}

renderGrid();
</script>
</body>
</html>
